<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Conto Blockquote</title>
        <meta charset="utf-8">
    </head>
    <body>
        <h1>Kekuwatan Web</h1>
        <p>Miturut Tim Berners-Lee, panemu World Wide Web,</p>
        <blockquote>
            Kekuwatan Web ana ing sifat universale. Akses kanggo kabeh wong tanpa mikirake kahanan disabilitas iku aspek sing penting banget.
        </blockquote>
    </body>
</html>
